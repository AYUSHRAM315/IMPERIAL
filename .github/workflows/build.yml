name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl
          mkdir -p /tmp/android-sdk/cmdline-tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-109.0.0_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-sdk/cmdline-tools
          mv /tmp/android-sdk/cmdline-tools/cmdline-tools /tmp/android-sdk/cmdline-tools/latest
          chmod -R +x /tmp/android-sdk/cmdline-tools/latest/bin
          echo "ANDROID_SDK_ROOT=/tmp/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/tmp/android-sdk" >> $GITHUB_ENV
          echo "/tmp/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/tmp/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/tmp/android-sdk --licenses
          yes | /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/tmp/android-sdk "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Fix Gradle Permissions
        run: |
          sudo apt-get install -y dos2unix
          dos2unix android/gradlew
          chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Imperial-Private-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk